services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindvr-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      MODEL_PATH: models/phq8_model.joblib
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mindvr-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped